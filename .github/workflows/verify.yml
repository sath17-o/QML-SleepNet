name: Verify guide-locked frozen submission

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify guide lock, artifacts, scientific contracts and notebooks
        run: python scripts/run_pipeline.py --mode verify
