name: Verify reproducibility package

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: |
          python -m pip install -r requirements-verify.txt
          python -m pip install -r requirements-final-evaluation.txt
      - name: Verify artifacts, methodology contracts, notebooks and tests
        run: python scripts/run_pipeline.py --mode verify
      - name: Reproduce final integrated 25/75 evaluation
        run: python scripts/run_final_integrated_evaluation.py
      - name: Reproduce final integrated evaluation with Windows-style CRLF labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('precomputed/final_integrated_inputs/OFFICIAL_X_EVALUATION_LABELS.csv')
          data = p.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          p.write_bytes(data.replace(b'\n', b'\r\n'))
          PY
          python scripts/run_final_integrated_evaluation.py
